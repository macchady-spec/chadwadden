  <style>
    body { min-height:100vh; background:linear-gradient(145deg,var(--navy),#123a55); color:white; display:grid; place-items:center; padding:32px; }
    .confirmed-card { width:min(680px,100%); background:white; color:var(--text); border-radius:20px; padding:clamp(28px,6vw,54px); box-shadow:var(--shadow-lg); text-align:center; }
    .confirmed-mark { width:64px; height:64px; border-radius:50%; background:rgba(14,165,160,.13); color:var(--teal); display:grid; place-items:center; margin:0 auto 22px; font-size:2rem; font-weight:800; }
    .confirmed-card h1 { font-size:clamp(2rem,6vw,3.2rem); margin-bottom:16px; }
    .confirmed-card p { color:var(--gray-500); margin:0 auto 24px; max-width:540px; }
    .confirmed-actions { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JR7LL2L3DE"></script>
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-JR7LL2L3DE');
    try {
      if (!sessionStorage.getItem('trace_teacher_pack_lead_recorded')) {
        gtag('event','generate_lead',{campaign_id:'trace_teacher_pack',content_id:'kit_confirmation'});

    <div class="confirmed-actions">
      <a class="btn btn-teal" id="open-trace-pack" href="/resources/trace-teacher-pack/">Open the TRACE Pack →</a>
      <a class="btn btn-secondary" href="/">Return home</a>
    </div>

  <script>
    document.getElementById('open-trace-pack').addEventListener('click',function(){
      if(typeof window.gtag==='function')window.gtag('event','teacher_pack_open',{campaign_id:'trace_teacher_pack',content_id:'confirmation_page'});
