<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">TRACE: Plan the AI job and preserve student cognition</title>
  <desc id="desc">A two-column infographic connecting Task, Relevant context, Actions and aids, Checks, and Exit and escalation with Try first, Reveal reasoning, Annotate, Check, and Evolve.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2434"/>
      <stop offset="1" stop-color="#123f4a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061923" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 750; letter-spacing: 3px; }
      .title { font-size: 58px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 27px; font-weight: 450; }
      .column { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
      .letter { font-size: 48px; font-weight: 850; }
      .step { font-size: 25px; font-weight: 800; }
      .detail { font-size: 19px; font-weight: 450; }
      .footer { font-size: 17px; font-weight: 550; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#f5f2ea"/>
  <rect x="0" y="0" width="1080" height="300" fill="url(#header)"/>
  <circle cx="953" cy="77" r="150" fill="none" stroke="#41c7be" stroke-width="2" opacity="0.24"/>
  <circle cx="953" cy="77" r="105" fill="none" stroke="#41c7be" stroke-width="2" opacity="0.18"/>

  <text x="72" y="68" class="sans eyebrow" fill="#71ded4">A COGNITION-FIRST WORKING FRAMEWORK</text>
  <text x="72" y="145" class="sans title" fill="#ffffff">TRACE the thinking.</text>
  <text x="72" y="211" class="sans title" fill="#ffffff">Don’t erase it.</text>
  <text x="74" y="259" class="sans subtitle" fill="#d9e9e8">One framework. Two responsibilities.</text>

  <rect x="54" y="332" width="972" height="92" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="54" y="332" width="486" height="92" rx="22" fill="#e9f7f5"/>
  <path d="M540 332v92" stroke="#c9d8d7" stroke-width="2"/>
  <text x="297" y="387" text-anchor="middle" class="sans column" fill="#0e6c6b">PLAN THE AI JOB</text>
  <text x="783" y="387" text-anchor="middle" class="sans column" fill="#234150">PRESERVE STUDENT COGNITION</text>

  <!-- T -->
  <rect x="54" y="452" width="972" height="132" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="112" cy="518" r="38" fill="#0f8f8b"/>
  <text x="112" y="535" text-anchor="middle" class="sans letter" fill="#ffffff">T</text>
  <text x="171" y="506" class="sans step" fill="#102d3b">Task</text>
  <text x="171" y="540" class="sans detail" fill="#526875">Define the observable outcome.</text>
  <path d="M493 518h88" stroke="#41bfb7" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 507l12 11-12 11" fill="none" stroke="#41bfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="618" y="506" class="sans step" fill="#102d3b">Try first</text>
  <text x="618" y="540" class="sans detail" fill="#526875">Retrieve and attempt before assistance.</text>

  <!-- R -->
  <rect x="54" y="604" width="972" height="132" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="112" cy="670" r="38" fill="#137b86"/>
  <text x="112" y="687" text-anchor="middle" class="sans letter" fill="#ffffff">R</text>
  <text x="171" y="658" class="sans step" fill="#102d3b">Relevant context</text>
  <text x="171" y="692" class="sans detail" fill="#526875">Supply sources, limits, examples, voice.</text>
  <path d="M493 670h88" stroke="#41bfb7" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 659l12 11-12 11" fill="none" stroke="#41bfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="618" y="658" class="sans step" fill="#102d3b">Reveal reasoning</text>
  <text x="618" y="692" class="sans detail" fill="#526875">Make the learner’s thinking visible.</text>

  <!-- A -->
  <rect x="54" y="756" width="972" height="132" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="112" cy="822" r="38" fill="#1c687e"/>
  <text x="112" y="839" text-anchor="middle" class="sans letter" fill="#ffffff">A</text>
  <text x="171" y="810" class="sans step" fill="#102d3b">Actions and aids</text>
  <text x="171" y="844" class="sans detail" fill="#526875">Name permitted tools, skills, and changes.</text>
  <path d="M493 822h88" stroke="#41bfb7" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 811l12 11-12 11" fill="none" stroke="#41bfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="618" y="810" class="sans step" fill="#102d3b">Annotate</text>
  <text x="618" y="844" class="sans detail" fill="#526875">Find argument, evidence, explanation, gaps.</text>

  <!-- C -->
  <rect x="54" y="908" width="972" height="132" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="112" cy="974" r="38" fill="#26536e"/>
  <text x="112" y="991" text-anchor="middle" class="sans letter" fill="#ffffff">C</text>
  <text x="171" y="962" class="sans step" fill="#102d3b">Checks</text>
  <text x="171" y="996" class="sans detail" fill="#526875">Define evidence, tests, rubric, success.</text>
  <path d="M493 974h88" stroke="#41bfb7" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 963l12 11-12 11" fill="none" stroke="#41bfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="618" y="962" class="sans step" fill="#102d3b">Check</text>
  <text x="618" y="996" class="sans detail" fill="#526875">Compare the work with visible criteria.</text>

  <!-- E -->
  <rect x="54" y="1060" width="972" height="132" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="112" cy="1126" r="38" fill="#303f61"/>
  <text x="112" y="1143" text-anchor="middle" class="sans letter" fill="#ffffff">E</text>
  <text x="171" y="1114" class="sans step" fill="#102d3b">Exit and escalation</text>
  <text x="171" y="1148" class="sans detail" fill="#526875">State when the AI stops; a human decides.</text>
  <path d="M493 1126h88" stroke="#41bfb7" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 1115l12 11-12 11" fill="none" stroke="#41bfb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="618" y="1114" class="sans step" fill="#102d3b">Evolve</text>
  <text x="618" y="1148" class="sans detail" fill="#526875">Revise while retaining authorship.</text>

  <rect x="54" y="1224" width="972" height="78" rx="20" fill="#0c2434"/>
  <text x="540" y="1257" text-anchor="middle" class="sans footer" fill="#ffffff">A working framework by Chad Wadden · not a validated learning intervention</text>
  <text x="540" y="1284" text-anchor="middle" class="sans footer" fill="#71ded4">Practical AI and digital learning tools, built by a teacher still in the classroom.</text>
</svg>
